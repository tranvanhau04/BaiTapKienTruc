<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CQRS Train Ticket System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h2 class="mb-4">Hệ Thống Bán Vé Tàu (CQRS Demo)</h2>

<div class="card mb-5">
    <div class="card-header bg-primary text-white">Đặt Vé Mới (Command Side)</div>
    <div class="card-body">
        <form th:action="@{/view/tickets/book}" method="post" class="row g-3">
            <div class="col-md-5">
                <input type="text" name="train" class="form-control" placeholder="Mã chuyến tàu (VD: SE1)" required>
            </div>
            <div class="col-md-5">
                <input type="text" name="name" class="form-control" placeholder="Tên hành khách" required>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-success w-100">Đặt Vé</button>
            </div>
        </form>
    </div>
</div>

<div class="card">
    <div class="card-header bg-info text-white">Danh Sách Vé Đã Đặt (Query Side)</div>
    <div class="card-body">
        <table class="table table-striped">
            <thead>
            <tr>
                <th>Chuyến Tàu</th>
                <th>Hành Khách</th>
                <th>Trạng Thái</th>
                <th>Thao Tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="ticket : ${tickets}">
                <td th:text="${ticket.trainNumber}"></td>
                <td th:text="${ticket.customerName}"></td>
                <td>
                            <span th:class="${ticket.status == 'BOOKED' ? 'badge bg-warning' : 'badge bg-danger'}"
                                  th:text="${ticket.status}"></span>
                </td>
                <td>
                    <form th:if="${ticket.status == 'BOOKED'}"
                          th:action="@{/view/tickets/cancel/{id}(id=${ticket.id})}" method="post">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Hủy Vé</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
